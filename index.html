<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What are you going to do? · 나의 계획 말하기</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🍁%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="leaves" aria-hidden="true">
      <span>🍁</span><span>🍂</span><span>🍁</span><span>🍂</span><span>🍁</span><span>🍂</span><span>🍁</span><span>🍂</span>
    </div>
    <h1 class="en">🍁 What are you going to do?</h1>
    <p class="subtitle">언제 무엇을 할지 묻고 대답해요 · 천재(함) 6학년 9단원</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="basic" role="tab"><span>🎨</span> <span class="long">활동 카드 (초급)</span><span class="short">초급 카드</span></button>
    <button class="tab-btn" data-tab="mid" role="tab"><span>🎨</span> <span class="long">활동 카드 (중급)</span><span class="short">중급 카드</span></button>
    <button class="tab-btn" data-tab="practice" role="tab"><span>🎤</span> 연습하기 <span id="plan-count" class="badge">0/5</span></button>
  </nav>

  <main>
    <!-- 활동 카드 (초급/중급 공통 구조: app.js가 채움) -->
    <section id="tab-basic" class="tab-panel active" data-level="basic"></section>
    <section id="tab-mid" class="tab-panel" data-level="mid"></section>

    <!-- 연습하기 -->
    <section id="tab-practice" class="tab-panel">
      <div class="block summary-block no-print">
        <div class="summary">
          <span>🎙️ 총 연습 <b id="sum-count">0</b>회</span>
          <span>📊 평균 정확도 <b id="sum-avg">-</b></span>
          <span>✅ 연습한 문장 <b id="sum-done">0/5</b></span>
        </div>
        <div class="summary-actions">
          <button id="btn-clear" class="btn soft">🧹 기록 지우기</button>
          <button id="btn-play-all" class="btn soft">🔊 전체 듣기</button>
          <button id="btn-print" class="btn soft">🖨️ 인쇄하기</button>
        </div>
        <p id="mic-support" class="hint"></p>
      </div>

      <div class="block plan-block">
        <h2>📅 나의 계획표 · <span class="en">My Plans</span></h2>
        <div id="plan-list"></div>
      </div>
    </section>
  </main>

  <div id="word-popup" class="word-popup hidden" role="tooltip"></div>

  <footer class="no-print">🍂 단어를 누르면 뜻과 발음을 알 수 있어요 · 말하기는 Chrome 권장</footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
